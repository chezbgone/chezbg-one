services:
  caddy-proxy:
    image: ghcr.io/chezbgone/chezbg-one:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - caddy
      - docker-api
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    labels:
      # --- Global options (these ARE valid at global scope) ---
      caddy.email: ${ACME_EMAIL}         # set in .env (gitignored), not committed

      # --- Shared snippet imported by every site ---
      # Site directives like `encode` and `header` are NOT valid as global
      # options and do not inherit across sites, so they live in a snippet
      # that each project imports via `caddy.import: common`.
      caddy_0: (common)
      caddy_0.encode: gzip zstd
      caddy_0.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      caddy_0.header.X-Content-Type-Options: nosniff
      caddy_0.header.X-Frame-Options: DENY
      caddy_0.header.Referrer-Policy: strict-origin-when-cross-origin

  # Only this service can access the host socket. Caddy gets read-only
  # discovery API access over a private network; application containers
  # cannot reach this API, and no API port is published on the host.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.5.0
    restart: unless-stopped
    environment:
      BIND_CONFIG: "0.0.0.0:2375"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    networks:
      - docker-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s

networks:
  docker-api:
    internal: true
  caddy:
    external: true
    name: caddy

volumes:
  caddy_data: {}
  caddy_config: {}

name: Build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - projects/**
      - Makefile
      - tests/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

# A newer run on the same ref cancels an older build before it can publish.
concurrency:
  group: proxy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chezbg-one

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment configuration and image promotion
        run: python3 -m unittest discover -s tests -v

  build-and-push:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote the current main commit to latest
        run: bash scripts/publish-latest.sh

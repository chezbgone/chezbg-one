name: Build Rainbgone

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}/rainbgone
  RELEASE: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Rainbgone source
        uses: actions/checkout@v7
        with:
          repository: chezbgone/rainbgone
          ref: 025a8264f78826468db85fb18b10ffa7183dfb18
          path: source/rainbgone
          token: ${{ secrets.RAINBGONE_SOURCE_TOKEN || github.token }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the backend image
        uses: docker/build-push-action@v7
        with:
          context: source/rainbgone
          file: projects/rainbgone/backend.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.RELEASE }}
          cache-from: type=gha,scope=rainbgone-backend
          cache-to: type=gha,mode=max,scope=rainbgone-backend

      - name: Publish the frontend image
        uses: docker/build-push-action@v7
        with:
          context: source/rainbgone/frontend
          file: projects/rainbgone/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.RELEASE }}
          cache-from: type=gha,scope=rainbgone-frontend
          cache-to: type=gha,mode=max,scope=rainbgone-frontend

      - name: Show deploy command
        run: |
          printf '`make rainbgone RELEASE=%s`\n' "$RELEASE" >> "$GITHUB_STEP_SUMMARY"
